<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff1f6">
  <title>For Deee 💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="site-shell">
    <header class="topbar">
      <a class="wordmark" href="#" aria-label="For Deee">for deee <span>♡</span></a>
      <div class="counter" id="counter">01 <span>/</span> 18</div>
    </header>

    <section class="intro" id="intro">
      <div class="eyebrow"><span class="tiny-heart">♥</span> A little something for you</div>
      <h1>For my <em>Deee.</em></h1>
      <p class="intro-copy">18 little moments, made with love.<br>Ready, birthday girl?</p>
      <button class="primary-button" id="startButton">Open your surprise <span>→</span></button>
      <div class="intro-decoration" aria-hidden="true">
        <span class="doodle d1">♡</span><span class="doodle d2">✳</span><span class="doodle d3">♡</span>
      </div>
    </section>

    <section class="slide-view hidden" id="slideView" aria-live="polite">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <article class="slide-card" id="slideCard">
        <div class="slide-kicker" id="slideKicker">A LITTLE NOTE FOR YOU</div>
        <div class="slide-symbol" id="slideSymbol" aria-hidden="true">♡</div>
        <h2 id="slideTitle">To my birthday girl</h2>
        <p class="slide-paragraph" id="slideParagraph"></p>
        <div class="slide-bottom">
          <span class="made-with-love">made with love <span>♥</span></span>
          <div class="navigation">
            <button class="secondary-button" id="prevButton" aria-label="Previous slide">←</button>
            <button class="primary-button next-button" id="nextButton">Next <span>→</span></button>
          </div>
        </div>
      </article>
      <p class="hint" id="hint">one little page at a time ♡</p>
    </section>

    <footer class="footer"><span>made for you, with love</span><span>♡</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
